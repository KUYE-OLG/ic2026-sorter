[project]
name = "ic2026-sorter-control"
version = "0.1.0"
description = "Control software skeleton for IC2026 intelligent sorter"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "pyserial>=3.5",
]

[project.optional-dependencies]
ai = ["onnxruntime>=1.16"]
display = ["pygame>=2.5"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
